<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
	<nav th:fragment="pager(page, baseUrl, q)" th:if="${page.totalPages > 1}" aria-label="Navigasi halaman">
		<ul class="pagination pagination-sm mb-0">
			<li class="page-item" th:classappend="${page.first} ? 'disabled'">
				<a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1}, q=${q})}" aria-label="Sebelumnya">
					<i class="bi bi-chevron-left"></i>
				</a>
			</li>
			<li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
				th:classappend="${i == page.number} ? 'active'">
				<a class="page-link" th:href="@{${baseUrl}(page=${i}, q=${q})}" th:text="${i + 1}">1</a>
			</li>
			<li class="page-item" th:classappend="${page.last} ? 'disabled'">
				<a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1}, q=${q})}" aria-label="Berikutnya">
					<i class="bi bi-chevron-right"></i>
				</a>
			</li>
		</ul>
	</nav>
</body>
</html>
