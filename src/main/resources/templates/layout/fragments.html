<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
	<aside th:fragment="sidebar" class="app-sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar"
		aria-labelledby="appSidebarLabel">
		<div class="offcanvas-header d-lg-none">
			<a class="app-brand m-0" th:href="@{/dashboard}" id="appSidebarLabel">
				<span class="app-brand-mark"><i class="bi bi-shop"></i></span>
				<span>Sistem Penjualan</span>
			</a>
			<button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
				data-bs-target="#appSidebar" aria-label="Tutup"></button>
		</div>

		<a class="app-brand d-none d-lg-flex" th:href="@{/dashboard}">
			<span class="app-brand-mark"><i class="bi bi-shop"></i></span>
			<span>Sistem Penjualan</span>
		</a>

		<div class="offcanvas-body">
			<nav class="app-nav" aria-label="Navigasi utama">
				<span class="app-nav-label">Utama</span>
				<a class="nav-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'" th:href="@{/dashboard}">
					<i class="bi bi-speedometer2"></i> Dashboard
				</a>

				<span class="app-nav-label">Data Master</span>
				<a class="nav-link" th:classappend="${activeMenu == 'pelanggan'} ? 'active'" th:href="@{/pelanggan}">
					<i class="bi bi-people"></i> Data Pelanggan
				</a>
				<a class="nav-link" th:classappend="${activeMenu == 'barang'} ? 'active'" th:href="@{/barang}">
					<i class="bi bi-box-seam"></i> Data Barang
				</a>

				<span class="app-nav-label">Operasional</span>
				<a class="nav-link" th:classappend="${activeMenu == 'transaksi'} ? 'active'" th:href="@{/transaksi}">
					<i class="bi bi-receipt"></i> Transaksi
				</a>
				<a class="nav-link" th:classappend="${activeMenu == 'laporan'} ? 'active'" th:href="@{/laporan}">
					<i class="bi bi-file-earmark-bar-graph"></i> Laporan
				</a>

				<span class="app-nav-label">Sistem</span>
				<span class="nav-link disabled"><i class="bi bi-gear"></i> Pengaturan
					<span class="badge badge-soon">Segera</span></span>
			</nav>

			<div class="app-sidebar-footer">
				<div class="small">© Sistem Informasi Penjualan</div>
			</div>
		</div>
	</aside>

	<header th:fragment="topbar" class="app-topbar">
		<button class="btn btn-light border d-lg-none" type="button" data-bs-toggle="offcanvas"
			data-bs-target="#appSidebar" aria-controls="appSidebar" aria-label="Buka navigasi">
			<i class="bi bi-list"></i>
		</button>
		<div class="app-topbar-title">Sistem Informasi Penjualan</div>
		<div class="d-flex align-items-center gap-3 ms-auto">
			<span class="d-none d-sm-inline text-muted small" th:if="${currentUser != null}">
				<i class="bi bi-person-circle me-1"></i><span th:text="${currentUser}">admin</span>
			</span>
			<form th:action="@{/logout}" method="post" class="m-0">
				<button type="submit" class="btn btn-outline-secondary btn-sm">
					<i class="bi bi-box-arrow-right me-1"></i>Keluar
				</button>
			</form>
		</div>
	</header>
</body>
</html>
