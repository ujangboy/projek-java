<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page(${pageTitle}, ~{::section})}">
<body>
	<section>
		<div class="page-heading">
			<div>
				<span class="eyebrow">Data Master</span>
				<h1 th:text="${pageTitle}">Tambah Barang</h1>
				<p>Harga dan stok tersimpan langsung ke database.</p>
			</div>
		</div>

		<div class="card app-card form-card">
			<div class="card-body">
				<form th:action="${formAction}" th:object="${barang}" method="post" novalidate>
					<div class="row g-3">
						<div class="col-12 col-md-4">
							<label for="kodeBarang" class="form-label">Kode Barang <span class="text-danger">*</span></label>
							<input type="text" id="kodeBarang" class="form-control" th:field="*{kodeBarang}"
								th:classappend="${#fields.hasErrors('kodeBarang')} ? 'is-invalid'"
								maxlength="20" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('kodeBarang')}"
								th:errors="*{kodeBarang}"></div>
						</div>
						<div class="col-12 col-md-8">
							<label for="namaBarang" class="form-label">Nama Barang <span class="text-danger">*</span></label>
							<input type="text" id="namaBarang" class="form-control" th:field="*{namaBarang}"
								th:classappend="${#fields.hasErrors('namaBarang')} ? 'is-invalid'"
								maxlength="100" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('namaBarang')}"
								th:errors="*{namaBarang}"></div>
						</div>

						<div class="col-12 col-md-4">
							<label for="satuan" class="form-label">Satuan <span class="text-danger">*</span></label>
							<input type="text" id="satuan" class="form-control" th:field="*{satuan}"
								th:classappend="${#fields.hasErrors('satuan')} ? 'is-invalid'"
								maxlength="20" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('satuan')}"
								th:errors="*{satuan}"></div>
						</div>
						<div class="col-12 col-md-4">
							<label for="harga" class="form-label">Harga <span class="text-danger">*</span></label>
							<div class="input-group has-validation">
								<span class="input-group-text">Rp</span>
								<input type="number" id="harga" class="form-control" th:field="*{harga}"
									th:classappend="${#fields.hasErrors('harga')} ? 'is-invalid'"
									min="0" step="0.01" required>
								<div class="invalid-feedback" th:if="${#fields.hasErrors('harga')}"
									th:errors="*{harga}"></div>
							</div>
						</div>
						<div class="col-6 col-md-2">
							<label for="stok" class="form-label">Stok <span class="text-danger">*</span></label>
							<input type="number" id="stok" class="form-control" th:field="*{stok}"
								th:classappend="${#fields.hasErrors('stok')} ? 'is-invalid'"
								min="0" step="1" required>
							<div class="invalid-feedback" th:if="${#fields.hasErrors('stok')}"
								th:errors="*{stok}"></div>
						</div>
						<div class="col-6 col-md-2">
							<label for="stokMinimum" class="form-label">Stok Min.</label>
							<input type="number" id="stokMinimum" class="form-control" th:field="*{stokMinimum}"
								th:classappend="${#fields.hasErrors('stokMinimum')} ? 'is-invalid'"
								min="0" step="1">
							<div class="invalid-feedback" th:if="${#fields.hasErrors('stokMinimum')}"
								th:errors="*{stokMinimum}"></div>
						</div>
					</div>

					<div class="d-flex gap-2 pt-4">
						<button class="btn btn-primary" type="submit">
							<i class="bi bi-save me-1"></i>Simpan
						</button>
						<a class="btn btn-outline-secondary" th:href="@{/barang}">Batal</a>
					</div>
				</form>
			</div>
		</div>
	</section>
</body>
</html>
