<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layout/base :: page('Data Barang', ~{::section})}">
<body>
	<section>
		<div class="page-heading">
			<div>
				<span class="eyebrow">Data Master</span>
				<h1>Data Barang</h1>
				<p th:text="${page.totalElements} + ' barang terdaftar'">8 barang terdaftar</p>
			</div>
			<a class="btn btn-primary" th:href="@{/barang/new}">
				<i class="bi bi-plus-lg me-1"></i>Tambah Barang
			</a>
		</div>

		<div class="card app-card">
			<div class="card-body">
				<form class="toolbar" method="get" th:action="@{/barang}" role="search">
					<div class="input-group">
						<span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
						<input type="search" class="form-control" name="q" th:value="${q}"
							placeholder="Cari kode atau nama barang..." aria-label="Cari barang">
						<button class="btn btn-outline-secondary" type="submit">Cari</button>
					</div>
					<a th:if="${q != null and !q.isEmpty()}" class="btn btn-link" th:href="@{/barang}">Reset</a>
				</form>

				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead>
							<tr>
								<th>Kode</th>
								<th>Nama Barang</th>
								<th>Satuan</th>
								<th class="text-end">Harga</th>
								<th class="text-center">Stok</th>
								<th class="text-end">Aksi</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="b : ${page.content}">
								<td class="fw-semibold" th:text="${b.kodeBarang}">BRG-001</td>
								<td th:text="${b.namaBarang}">Kertas HVS</td>
								<td th:text="${b.satuan}">rim</td>
								<td class="text-end"
									th:text="${'Rp ' + #numbers.formatDecimal(b.harga, 1, 'POINT', 2, 'COMMA')}">
									Rp 55.000,00
								</td>
								<td class="text-center">
									<span class="badge"
										th:classappend="${b.stok <= b.stokMinimum} ? 'text-bg-danger' : 'text-bg-success'"
										th:text="${b.stok}">40</span>
									<div class="text-muted small" th:text="${'min. ' + b.stokMinimum}">min. 10</div>
								</td>
								<td class="text-end text-nowrap">
									<a class="btn btn-sm btn-outline-secondary"
										th:href="@{/barang/{id}/edit(id=${b.idBarang})}">
										<i class="bi bi-pencil"></i> Edit
									</a>
									<form class="d-inline" method="post"
										th:action="@{/barang/{id}/delete(id=${b.idBarang})}"
										onsubmit="return confirm('Hapus barang ini?')">
										<button class="btn btn-sm btn-outline-danger" type="submit">
											<i class="bi bi-trash"></i> Hapus
										</button>
									</form>
								</td>
							</tr>
							<tr th:if="${page.empty}">
								<td colspan="6" class="text-center text-muted py-4">
									Tidak ada barang yang cocok.
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="d-flex justify-content-between align-items-center mt-3">
					<span class="text-muted small" th:text="${page.totalElements} + ' data'">8 data</span>
					<div th:replace="~{layout/pagination :: pager(${page}, '/barang', ${q})}"></div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
