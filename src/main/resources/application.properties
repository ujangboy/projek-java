spring.application.name=penjualan

# Local MySQL (Laragon). Override with DB_USERNAME / DB_PASSWORD when needed.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_sistem_penjualan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Local development.
spring.thymeleaf.cache=false
server.port=8080
server.error.whitelabel.enabled=false

# Logo upload limit (used from Phase 6).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.upload-dir=uploads
